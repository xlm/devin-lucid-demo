[package]
name = "charging-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "charging_processor"
path = "src/lib.rs"

[[bin]]
name = "charging-processor"
path = "src/main.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "3"
