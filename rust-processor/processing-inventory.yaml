# Declared processing inventory of the migrated Rust charging-session
# processor (12 dimensions, see governance/README.md), as designed in
# docs/build-contract.md: same input and output topics, same output
# schemas, same retention, diagnostic logs to stderr without identifiers.
# The runtime changes from Scala/Spark to a Rust binary, which is recorded
# under implementation. Synthetic demo declarations only. Owned by humans;
# verification code reads it and diffs it against the approved baseline.
schema_version: "1.0"
processor: candidate
service: charging-session-processor
# Informational, not a governed dimension: shown to the reviewer, not diffed
# as a policy input.
implementation:
  runtime: Rust (stable) single-process binary, no Spark or JVM; default build has no Kafka or C dependencies
  source: rust-processor/
  logs: diagnostic logs to stderr only, no identifiers or location
dimensions:
  inputs:
    - id: charging.events.v1
      kind: topic
      schema: contracts/charging.events.v1.schema.json
      message_key: vehicle_id
      fields_read: [battery_soc, charging_power_kw, charging_state, energy_delivered_kwh, event_id, event_timestamp, ingestion_timestamp, schema_version, sequence_number, session_id, synthetic_location, vehicle_id]

  sensitive_fields:
    - id: synthetic_location
      source: charging.events.v1
      classification: sensitive_location
      handling: validated against ^SYN-[A-Z0-9-]+$, then discarded; never held in session state
      propagates_to: []
    - id: vehicle_id
      source: charging.events.v1
      classification: vehicle_identifying
      handling: session key component and Kafka message key of the summary topic
      propagates_to: [charging.errors.v1, charging.session.summary.v1, processor.checkpoint]
    - id: session_id
      source: charging.events.v1
      classification: vehicle_identifying
      handling: session key component; session ids embed vehicle linkage
      propagates_to: [charging.errors.v1, charging.session.summary.v1, processor.checkpoint]

  purposes:
    - id: charging-session-summarisation
      description: Aggregate charging events into one summary per (vehicle_id, session_id) for warranty energy accounting by consumer-warranty.
    - id: input-error-reporting
      description: Report invalid, late and post-close events on the error topic for operational triage, without payload, measurements or location.

  transforms:
    - {id: charging.session.summary.v1.session_id, op: PASSTHROUGH, inputs: [session_id]}
    - {id: charging.session.summary.v1.vehicle_id, op: PASSTHROUGH, inputs: [vehicle_id]}
    - {id: charging.session.summary.v1.start_ts, op: MIN, inputs: [event_timestamp]}
    - {id: charging.session.summary.v1.end_ts, op: MAX, inputs: [event_timestamp]}
    - {id: charging.session.summary.v1.total_energy_kwh, op: MAX, inputs: [energy_delivered_kwh]}
    - {id: charging.session.summary.v1.peak_power_kw, op: MAX, inputs: [charging_power_kw]}
    - {id: charging.session.summary.v1.event_count, op: COUNT_ACCEPTED_DEDUPED, inputs: [event_id]}
    - {id: charging.session.summary.v1.completion_reason, op: DERIVE_COMPLETION, inputs: [charging_state, event_timestamp]}
    - {id: charging.session.summary.v1.schema_version, op: CONSTANT, inputs: []}
    - {id: charging.errors.v1.error_type, op: VALIDATION_RESULT, inputs: []}
    - {id: charging.errors.v1.field, op: FIELD_NAME_ONLY, inputs: []}
    - {id: charging.errors.v1.input_line, op: INPUT_POSITION, inputs: []}
    - {id: charging.errors.v1.event_id, op: ECHO_IF_VALID, inputs: [event_id]}
    - {id: charging.errors.v1.vehicle_id, op: ECHO_IF_VALID, inputs: [vehicle_id]}
    - {id: charging.errors.v1.session_id, op: ECHO_IF_VALID, inputs: [session_id]}
    - {id: charging.errors.v1.schema_version, op: CONSTANT, inputs: []}
    - {id: charging.events.v1.synthetic_location, op: VALIDATE_AND_DISCARD, inputs: [synthetic_location]}

  output_schema:
    - id: charging.session.summary.v1
      schema: contracts/charging.session.summary.v1.schema.json
      fields: [completion_reason, end_ts, event_count, peak_power_kw, schema_version, session_id, start_ts, total_energy_kwh, vehicle_id]
    - id: charging.errors.v1
      schema: contracts/charging.errors.v1.schema.json
      fields: [error_type, event_id, field, input_line, schema_version, session_id, vehicle_id]

  output_destinations:
    - {id: charging.session.summary.v1, kind: topic, schema: charging.session.summary.v1, message_key: vehicle_id, identifiers: [session_id, vehicle_id]}
    - {id: charging.errors.v1, kind: topic, schema: charging.errors.v1, message_key: null, identifiers: [session_id, vehicle_id]}
    - {id: processor.stderr, kind: log, schema: null, message_key: null, identifiers: []}

  retention:
    - {id: charging.session.summary.v1, period: P90D}
    - {id: charging.errors.v1, period: P14D}
    - {id: processor.stderr, period: P14D}
    - {id: processor.checkpoint, period: "latest checkpoint only, replaced on each write"}

  access:
    - {id: charging.events.v1, readers: [charging-session-processor], writers: [charging-event-ingest]}
    - {id: charging.session.summary.v1, readers: [consumer-warranty], writers: [charging-session-processor]}
    - {id: charging.errors.v1, readers: [charging-platform-oncall], writers: [charging-session-processor]}
    - {id: processor.stderr, readers: [charging-platform-oncall], writers: [charging-session-processor]}
    - {id: processor.checkpoint, readers: [charging-session-processor], writers: [charging-session-processor]}

  logging:
    - id: processor.stderr
      sink: stderr
      allowed_content: [counts, error_type, event_id, input_line]
      prohibited_content: [session_id, synthetic_location, vehicle_id]

  external_deps:
    - id: kafka-compatible-broker
      kind: message-broker
      carries: [charging.errors.v1, charging.events.v1, charging.session.summary.v1]
      note: Kafka in the production design; Redpanda in the optional integration tier (demo simplification); none in the fast tier, which replays JSONL files.

  replication:
    - id: processor.checkpoint
      contents: [closed-key status, event_id dedupe sets per session key, input offset, max_event_ts, open-session aggregates keyed by (vehicle_id, session_id)]
      excludes: [synthetic_location]
      location: processor-managed checkpoint storage inside the deployment boundary

  deployment_boundary:
    - id: charging-processing-zone
      region: synthetic-region-1
      network_zone: telemetry-internal
      operator: charging-platform-team
