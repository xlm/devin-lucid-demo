# Field manifest for the legacy battery-health processor. Owned by humans
# (privacy reviewer and data owner). Code reads this file, never writes it.
#
# Every value here is a synthetic demo declaration. Retention periods,
# role names and encryption statements describe design intent. No check in
# this repository verifies retention, access control or encryption at runtime.
#
# Classification is per field in isolation. A record is handled at the most
# restricted classification among its fields.
# Destination ids: battery.health.daily.v1 and battery.errors.v1 (topics),
# processor.stderr (diagnostic log), processor.checkpoint (managed state).
schema_version: "1.0"

topics:
  - id: battery.telemetry.v1
    schema: contracts/battery.telemetry.v1.schema.json
    record_classification: sensitive_location
    note: Input topic. Records may carry synthetic_location, so the raw record is restricted.
  - id: battery.health.daily.v1
    schema: contracts/battery.health.daily.v1.schema.json
    record_classification: vehicle_identifying
  - id: battery.errors.v1
    schema: contracts/battery.errors.v1.schema.json
    record_classification: vehicle_identifying

fields:
  # ---------------- battery.telemetry.v1 (input) ----------------
  - name: event_id
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Producer-assigned event identifier, used for daily-key de-duplication.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation, input-error-reporting]
    allowed_transformations: [DEDUPE_KEY, COUNT_ACCEPTED_DEDUPED, ECHO_IF_VALID]
    permitted_destinations: [battery.errors.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: vehicle_id
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Synthetic vehicle key VEH-nnnn and daily summary key component.
    source: vehicle telemetry producer (synthetic)
    classification: vehicle_identifying
    personal: true
    sensitive: false
    purpose: [daily-health-summarisation, input-error-reporting]
    allowed_transformations: [PASSTHROUGH, DAILY_KEY, ECHO_IF_VALID]
    permitted_destinations: [battery.health.daily.v1, battery.errors.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: pack_id
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Synthetic battery pack identifier and daily summary key component.
    source: vehicle telemetry producer (synthetic)
    classification: vehicle_identifying
    personal: true
    sensitive: false
    purpose: [daily-health-summarisation, input-error-reporting]
    allowed_transformations: [PASSTHROUGH, DAILY_KEY, ECHO_IF_VALID]
    permitted_destinations: [battery.health.daily.v1, battery.errors.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: event_timestamp
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: UTC event time. Drives the daily key, watermark, lateness and latest SOH selection.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [UTC_DAY_KEY, WATERMARK, LATEST_BY_EVENT_TIMESTAMP_SEQUENCE]
    permitted_destinations: [processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: ingestion_timestamp
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Ingestion time. Validated, otherwise unused.
    source: telemetry ingest (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [input-error-reporting]
    allowed_transformations: [VALIDATE]
    permitted_destinations: []
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: sequence_number
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Numeric tie-breaker for selecting latest SOH.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [LATEST_BY_EVENT_TIMESTAMP_SEQUENCE]
    permitted_destinations: [processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: cell_voltage_min_v
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Minimum cell voltage reading, in volts.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [MIN, MAX_PER_EVENT_SPREAD]
    permitted_destinations: [battery.health.daily.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: cell_voltage_max_v
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Maximum cell voltage reading, in volts.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [MAX, MAX_PER_EVENT_SPREAD]
    permitted_destinations: [battery.health.daily.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: pack_temp_c
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Battery pack temperature reading, in degrees Celsius.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [MAX]
    permitted_destinations: [battery.health.daily.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: state_of_health_pct
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Battery state of health percentage reading.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [LATEST_BY_EVENT_TIMESTAMP_SEQUENCE]
    permitted_destinations: [battery.health.daily.v1, processor.checkpoint]
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: schema_version
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Input schema version. Validated before other telemetry fields.
    source: vehicle telemetry producer (synthetic)
    classification: internal_operational
    personal: false
    sensitive: false
    purpose: [input-error-reporting]
    allowed_transformations: [VALIDATE]
    permitted_destinations: []
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: synthetic_location
    topic: battery.telemetry.v1
    schema_version: "1.x"
    description: Restricted synthetic location. Validated, then discarded.
    source: vehicle telemetry producer (synthetic)
    classification: sensitive_location
    personal: false
    sensitive: true
    purpose: [input-validation]
    allowed_transformations: [VALIDATE_AND_DISCARD]
    permitted_destinations: []
    access: battery-health-processor service identity
    logging: prohibited
    retention: P7D (input topic)
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  # ---------------- battery.health.daily.v1 (output) ----------------
  - name: vehicle_id
    topic: battery.health.daily.v1
    schema_version: "1.0"
    description: Vehicle identifier for the daily pack summary.
    source: PASSTHROUGH(battery.telemetry.v1.vehicle_id)
    classification: vehicle_identifying
    personal: true
    sensitive: false
    purpose: [daily-health-summarisation]
    allowed_transformations: [PASSTHROUGH]
    permitted_destinations: [battery.health.daily.v1]
    access: consumer-battery-health
    logging: prohibited
    retention: P90D
    encryption: in transit TLS to the broker, at rest platform-managed (declared, not verified here)

  - name: pack_id
